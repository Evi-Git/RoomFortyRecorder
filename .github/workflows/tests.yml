# Runs the unit tests on every push to main and every pull request.
# The Windows build is in node.js.yml; this job runs on Linux, so it skips the
# suites that need native Windows modules (uiohook-napi, noobs):
# activitys, parser, localisation and live.

name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v6

    - name: Setup Node JS
      uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: 'npm'

    - name: Install deps (no native builds)
      id: install
      run: npm ci --ignore-scripts

    # The checks below run even when an earlier one fails, so one PR run
    # reports every problem (but not after a failed install).
    #
    # tsconfig.ci.json stands in for the native Windows modules (noobs,
    # uiohook-napi) that --ignore-scripts doesn't install. Not `npx tsc`: the
    # deprecated `tsc` package in dependencies owns node_modules/.bin/tsc.
    - name: Type check
      run: node node_modules/typescript/bin/tsc --noEmit -p tsconfig.ci.json

    # Warnings are capped so they can't grow; lower the number when you fix some.
    - name: Lint
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: npx eslint src --ext .ts,.tsx --max-warnings 12

    - name: App tests (parsing, renderer, main, cloud)
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: npx jest src/__tests__/parsing src/__tests__/renderer src/__tests__/main src/__tests__/cloud

    - name: Guild server tests
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      working-directory: guild-cloud-server
      run: node --test
