# Builds the Windows installer and uploads it to a DRAFT GitHub release.
#
# How to use: GitHub -> Actions -> "Release" -> "Run workflow".
# Then test the installer from the draft, and click "Publish release".
# Installed apps only see the update once the release is published.
#
# The cloud URLs (https://roomfortyrecorder.com) are baked in by the defaults in
# .erb/configs/webpack.config.base.ts. Do NOT add empty WCR_CLOUD_* env vars
# here: an empty value overrides the default and breaks sign-in.

name: Release

on:
  workflow_dispatch:

permissions:
  contents: write # needed to create the release and upload the installer

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node JS
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Pre-flight checks
        run: node .github/scripts/check-release.mjs

      - name: Install deps
        shell: bash
        run: bash .github/scripts/run-logged.sh "npm ci" npm ci

      - name: Check the streaming engine patch was applied
        shell: bash
        run: bash .github/scripts/run-logged.sh "Engine patch check" node .erb/scripts/patch-noobs.js --verify

      - name: Build
        shell: bash
        run: bash .github/scripts/run-logged.sh "Build" npm run build

      # electron-builder uploads several files in parallel, and if no release
      # exists yet each upload can create its own draft. Creating the draft
      # up front means every file lands in the same one.
      - name: Create the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./release/app/package.json').version")
          tag="v$version"
          ids=$(gh api "repos/${{ github.repository }}/releases?per_page=100" --jq ".[] | select(.tag_name==\"$tag\") | .id")
          count=$(echo -n "$ids" | grep -c . || true)
          if [ "$count" -gt 1 ]; then
            echo "::error::There are $count draft releases for $tag. Delete the extras on the Releases page and run this again."
            exit 1
          elif [ "$count" -eq 0 ]; then
            gh api -X POST "repos/${{ github.repository }}/releases" \
              -f tag_name="$tag" -f name="$version" -f target_commitish="${{ github.sha }}" \
              -F draft=true --jq '"Created draft \(.name)"'
          else
            echo "Reusing existing draft for $tag"
          fi

      - name: Package and upload to a draft release
        shell: bash
        run: bash .github/scripts/run-logged.sh "Package" npx electron-builder build --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Keeps a copy on the workflow run too, in case the upload step misbehaves.
      - name: Save installer as a workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: installer
          path: |
            release/build/*.exe
            release/build/*.blockmap
            release/build/latest.yml
          retention-days: 14
