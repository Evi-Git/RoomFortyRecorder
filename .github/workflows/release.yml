# Builds the Windows installer, then creates a DRAFT GitHub release with it.
#
# How to use: GitHub -> Actions -> "Release" -> "Run workflow".
# Then test the installer from the draft, and click "Publish release".
# Installed apps only see the update once the release is published.
#
# The cloud URLs (https://roomfortyrecorder.com) are baked in by the defaults in
# .erb/configs/webpack.config.base.ts. Do NOT add empty WCR_CLOUD_* env vars
# here: an empty value overrides the default and breaks sign-in.

name: Release

on:
  workflow_dispatch:

permissions:
  contents: write # needed to create the release and upload the installer

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node JS
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Pre-flight checks
        run: node .github/scripts/check-release.mjs

      - name: Install deps
        shell: bash
        run: bash .github/scripts/run-logged.sh "npm ci" npm ci

      - name: Check the streaming engine patch was applied
        shell: bash
        run: bash .github/scripts/run-logged.sh "Engine patch check" node .erb/scripts/patch-noobs.js --verify

      - name: Build
        shell: bash
        run: bash .github/scripts/run-logged.sh "Build" npm run build

      # Build the installer first and only then create the draft with every
      # file attached, so a draft never shows up empty. (Publishing a draft
      # before its files are uploaded leaves a release with no installer and
      # no latest.yml, which breaks in-app updates.)
      - name: Package
        shell: bash
        run: bash .github/scripts/run-logged.sh "Package" npx electron-builder build --win --publish never

      - name: Create the draft release with the installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./release/app/package.json').version")
          tag="v$version"
          exe="release/build/RoomFortyRecorder-Setup${version}.exe"
          for f in "$exe" "$exe.blockmap" release/build/latest.yml; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing $f after packaging."
              exit 1
            fi
          done
          existing=$(gh api "repos/${{ github.repository }}/releases?per_page=100" --jq ".[] | select(.tag_name==\"$tag\") | .draft")
          if [ "$existing" = "false" ]; then
            echo "::error::$tag is already published. Bump the version in release/app/package.json."
            exit 1
          elif [ "$existing" = "true" ]; then
            echo "Updating the existing draft for $tag"
            gh release upload "$tag" "$exe" "$exe.blockmap" release/build/latest.yml --clobber -R "${{ github.repository }}"
          else
            gh release create "$tag" "$exe" "$exe.blockmap" release/build/latest.yml \
              --draft --title "$version" --target "${{ github.sha }}" \
              --notes "Room Forty Recorder $version. See CHANGELOG.md." -R "${{ github.repository }}"
          fi
          echo "Draft $tag is ready with the installer, blockmap and latest.yml."

      # Keeps a copy on the workflow run too, in case the upload step misbehaves.
      - name: Save installer as a workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: installer
          path: |
            release/build/*.exe
            release/build/*.blockmap
            release/build/latest.yml
          retention-days: 14
