# Checks the original Warcraft Recorder (aza547/wow-recorder) every Thursday
# for new changes and tries to merge them.
#
# - Merges cleanly  -> opens (or updates) a pull request "Merge upstream
#                      Warcraft Recorder". Review it, click Merge, then run
#                      the Release workflow as usual.
# - Real conflicts  -> opens an issue listing the files that need a human.
#                      Hand that to Claude with this repo attached.
# - Nothing new     -> does nothing.
#
# Nothing here ever releases or changes main by itself.
#
# Needs: Settings -> Actions -> General -> "Allow GitHub Actions to create
# and approve pull requests" ticked.

name: Upstream sync

on:
  schedule:
    - cron: '17 15 * * 4' # Thursdays ~11:17am Eastern, well clear of raid nights
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BRANCH: upstream-sync

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Fetch upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/aza547/wow-recorder.git
          git fetch --no-tags upstream main

      - name: Try the merge
        id: merge
        run: |
          git checkout -B "$BRANCH"
          set +e
          node .github/scripts/merge-upstream.mjs upstream/main
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" != 0 ] && [ "$code" != 2 ] && [ "$code" != 3 ]; then exit "$code"; fi

          # Upstream's own release notes since our last merge, for the PR/issue.
          {
            echo "Upstream commits being brought in:"
            echo
            git log --no-merges --format='- %s (%h)' HEAD..upstream/main | head -60
          } > notes.md

      - name: Open or update the pull request
        if: steps.merge.outputs.code == '0'
        run: |
          git commit -q -m "Merge upstream Warcraft Recorder ($(git rev-parse --short upstream/main))"
          git push -f origin "$BRANCH"
          {
            echo "Automatic merge of the latest [Warcraft Recorder](https://github.com/aza547/wow-recorder) changes. Routine conflicts (version number, changelog) were resolved automatically, keeping RoomFortyRecorder's values."
            echo
            echo "**Before merging:** skim the list below. After merging, add a line to CHANGELOG.md, bump the version, and run **Actions -> Release**."
            echo
            cat notes.md
          } > body.md
          if gh pr view "$BRANCH" --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --body-file body.md
          else
            gh pr create --head "$BRANCH" --base "${{ github.event.repository.default_branch }}" \
              --title "Merge upstream Warcraft Recorder" --body-file body.md
          fi

      - name: Open an issue for conflicts
        if: steps.merge.outputs.code == '2'
        run: |
          title="Upstream Warcraft Recorder changes need a manual merge"
          {
            echo "The weekly upstream sync found changes that conflict with RoomFortyRecorder's own edits, in:"
            echo
            sed 's/^/- `/; s/$/`/' conflicts.txt
            echo
            echo "Nothing has been changed. To resolve: attach this repo to a Claude session and ask it to merge \`upstream/main\` from https://github.com/aza547/wow-recorder (see docs/RELEASING.md)."
            echo
            cat notes.md
          } > body.md
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number -q '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
          else
            gh issue create --title "$title" --body-file body.md
          fi
