# Checks that the app installs and builds on every push and pull request.
# Releases are built by .github/workflows/release.yml (Actions -> Release).

name: RoomFortyRecorder CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Temporary: comparing GitHub's current Windows image with the older
        # one while diagnosing the native-module install failure.
        os: [ windows-latest, windows-2022 ]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v6

    - name: Setup Node JS
      uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: 'npm'

    - name: Environment
      shell: bash
      run: |
        echo "::notice title=Runner ${{ matrix.os }}::node $(node -v), npm $(npm -v), $(cmd //c ver | tr -d '\r' | xargs)"

    - name: Install deps
      shell: bash
      run: bash .github/scripts/run-logged.sh "npm ci on ${{ matrix.os }}" npm ci

    - name: Build
      shell: bash
      run: bash .github/scripts/run-logged.sh "Build on ${{ matrix.os }}" npm run build

    # https://github.com/aza547/wow-recorder/issues/737
    # - name: Run unit tests
    #   run: npm test
